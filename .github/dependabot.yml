version: 2
updates:
  # Weekly for non-critical dependency updates
  - package-ecosystem: pip
    directory: /backend
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    reviewers:
      - sahajpatel123
    labels:
      - dependencies
      - security
    # Allow updates outside schedule hours for security patches
    allow:
      - dependency-type: direct
      - dependency-type: production

  # Weekly for non-critical dependency updates
  - package-ecosystem: npm
    directory: /web/frontend
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    reviewers:
      - sahajpatel123
    labels:
      - dependencies
      - security
    allow:
      - dependency-type: direct
      - dependency-type: production

  # Keep GitHub Actions (checkout, setup-*, codeql-action, dependency-review)
  # on patched releases. Workflow actions are part of the supply-chain surface,
  # and stale tags have caused CI failures in this repo (CodeQL v5).
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    reviewers:
      - sahajpatel123
    labels:
      - dependencies
      - security
