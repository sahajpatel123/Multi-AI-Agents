name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'design/**'
      - 'arena-video/**'
      - 'app/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'design/**'
      - 'arena-video/**'
      - 'app/**'
  workflow_dispatch:

# Keep in-flight runs running when a new commit lands. Cancelling on every
# rapid push prevented CI from ever reaching a green check (backend pytest was
# repeatedly killed after a few percent). Each commit still gets its own run;
# the extra minutes are worth having trustworthy red/green signals.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend (pytest + compileall + security)
    runs-on: ubuntu-latest
    # Guard against a hung test holding the runner hostage indefinitely.
    # The full pytest suite can take a while, but 45 minutes is generous.
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: test-secret-key-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      ANTHROPIC_API_KEY: sk-ant-test-fake-key-for-ci
      OPENAI_API_KEY: sk-test-fake-key-for-ci
      ALLOWED_ORIGINS: http://localhost:5173
      ENVIRONMENT: development
      DATABASE_URL: sqlite:///./arena_ci.db
      # ENCRYPTION_KEY is generated at runtime below to keep the workflow
      # file free of any hardcoded Fernet key (gitleaks flags 44-char
      # base64 strings as generic-api-key regardless of entropy origin).
      RAZORPAY_API_KEY: rzp_test_dummy
      RAZORPAY_KEY_SECRET: dummy_secret
      RAZORPAY_WEBHOOK_SECRET: dummy_webhook
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Gitleaks below scans `git log <prev_sha>^..HEAD`; the
          # default fetch-depth: 1 leaves <prev_sha>^ unresolved so
          # the diff is empty AND the action exits non-zero. fetch-depth: 2
          # is just enough for a single-commit push but breaks on any
          # multi-commit push (the ^ of the second-newest SHA isn't in
          # the clone). 50 covers the realistic worst-case (a long-lived
          # branch batch-merged via a PR — e.g. the loop/fix-pin-floor
          # branch took ~11 commits to land, and PR merges don't shorten
          # the rev-walk because the merge-base can sit further back).
          # If we ever push a real batch >50 commits this will need to
          # bump again.
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install libmagic (required by python-magic)
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Dependency consistency check (pip check)
        # `pip check` verifies the installed dependency tree is internally
        # consistent (no missing or conflicting requirements). Catches
        # resolution mistakes before tests run, complementing pip-audit.
        run: python -m pip check

      - name: Generate runtime encryption key
        # Produce a fresh Fernet key per CI run so the workflow file never
        # contains a long-lived credential. The key is exposed to later
        # steps via $GITHUB_ENV.
        run: |
          pip install cryptography
          KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          echo "ENCRYPTION_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Security scan (pip-audit)
        run: |
          pip install pip-audit
          # Scan requirements.txt directly so we cover every dependency,
          # not just what happens to be installed in the CI environment.
          # A HIGH/CRITICAL finding now FAILS the build. The pin-floor
          # guard in the next step locks the direct-dep security floor,
          # so individual --ignore-vuln entries are reserved for transitive
          # deps where upstream has no fix planned. python-jose's transitive
          # ecdsa (PYSEC-2026-1325, Minerva) was eliminated entirely by the
          # python-jose -> PyJWT 2.13.0 migration in e9d4e2e + dd11ffc, so
          # no ignore is needed anymore.
          pip-audit -r requirements.txt

      - name: Pin floor guard (security-required versions)
        # Enforces security-version floors plus a ban on python-jose/ecdsa
        # (direct pins AND transitive reintroductions). Lives in a real
        # script instead of inline python-in-bash: the previous heredoc broke
        # every run because backticks inside its comment block triggered bash
        # command substitution.
        working-directory: ${{ github.workspace }}
        run: python scripts/check_security_floors.py

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Compile check
        run: python -m compileall -q arena

      - name: Test (pytest)
        run: pytest -q --no-header

  frontend:
    name: Frontend (vitest + tsc + build + security)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit (npm audit)
        run: |
          # Audit ALL deps (no --omit=dev) at HIGH+ severity. A finding
          # now FAILS the build — dependabot covers routine bumps, but
          # upstream-theft and freshly-disclosed React Router / PostCSS
          # RCE-class bugs need an immediate gate.
          #
          # Exception: advisories with no published patch on npm yet
          # (fixAvailable: null) are surfaced as a warning but do not
          # fail the build. The pin floor guard below defends against
          # silent downgrades of fixed versions.
          #
          # Tracked unfixable: GHSA-qwww-vcr4-c8h2 (react-router
          # RSC CSRF, fix is 8.3.0 which is not yet on npm).
          set +e
          audit_output=$(npm audit --audit-level=high --json)
          audit_exit=$?
          set -e
          if [ $audit_exit -eq 0 ]; then
            echo "No high+ vulnerabilities."
            exit 0
          fi
          unfixable=$(echo "$audit_output" | jq -r '
            (.vulnerabilities // {})
            | to_entries[]
            | .value.via[]
            | select(type == "object")
            | select(.fixAvailable == null)
            | .url // ""
          ')
          if [ -n "$unfixable" ]; then
            echo "::warning::Unfixable advisories detected (no published patch on npm). CI gate waived:"
            echo "$unfixable" | sed 's/^/  - /'
            npm audit --audit-level=high || true
            exit 0
          fi
          # Re-run audit (non-JSON) to surface the regular failure output.
          npm audit --audit-level=high
          exit 1

      - name: Pin floor guard (security-required versions)
        run: |
          # Defense-in-depth for packages with a security history in this
          # repo. A downgrade below the floor fails the build, matching
          # the backend's pin guard at ci.yml:69.
          node -e "
          const fs = require('fs');
          const REQUIRED = {
            'react-router-dom': '7.14.2',
            'postcss':         '8.5.23',  // GHSA-fxqj-rqcc-2cmp fixed in 8.5.23+
            'vitest':          '4.1.10',
          };
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const merged = { ...(pkg.dependencies || {}), ...(pkg.devDependencies || {}) };
          const failures = [];
          for (const [name, minVer] of Object.entries(REQUIRED)) {
            const raw = merged[name];
            if (raw === undefined) { failures.push('MISSING: ' + name + '>=' + minVer); continue; }
            // strip leading ^ or ~ to compare on the floor
            const m = raw.match(/^[\^~]?(\d+(?:\.\d+)+)/);
            if (!m) { failures.push('UNPARSED: ' + name + ' = ' + raw); continue; }
            const cur = m[1].split('.').map(Number);
            const floor = minVer.split('.').map(Number);
            const pad = (a, n) => a.concat(Array(Math.max(0, n - a.length)).fill(0));
            for (let i = 0; i < Math.max(cur.length, floor.length); i++) {
              const c = pad(cur, floor.length)[i];
              const f = pad(floor, cur.length)[i];
              if (c > f) break;
              if (c < f) { failures.push('REGRESSED: ' + name + '@' + m[1] + ' (require >= ' + minVer + ')'); break; }
            }
          }
          if (failures.length) {
            console.error('Security floor violations:');
            failures.forEach(f => console.error('  - ' + f));
            process.exit(1);
          }
          console.log('Security floor OK');
          "

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build

      - name: Summary
        if: always()
        run: |
          echo "## Frontend CI Summary"
          echo "- Job: ${{ github.job }}"
          echo "- Status: ${{ job.status }}"
          echo "- Commit: ${{ github.sha }}"

  dependency-review:
    name: Dependency review (PR vulnerability gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          # Fail the PR when it introduces a HIGH or CRITICAL dependency
          # vulnerability. This complements the pin-floor guards above:
          # those catch downgrades in our committed floor, this catches
          # newly-introduced vulnerable transitive versions before merge.
          fail-on-severity: high
          # Add a concise PR comment when the gate fails so the author
          # sees the offending package without leaving Actions.
          comment-summary-in-pr: on-failure

  integrity:
    name: Source integrity (no stray tokens)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fail on stray bare 'main' tokens
        # A past bad paste inserted bare `main` lines across Python/TS/TSX
        # source files, breaking imports and JSX parsing in CI while the
        # files still looked close to normal. rg matches a line that is
        # exactly `main` (with optional whitespace) — legitimate code uses
        # `def main`, `main()`, `export function main`, etc., so this scan
        # only fires on paste corruption.
        run: |
          set -euo pipefail
          if rg -n '^\s*main\s*$' backend/arena backend/tests web/frontend/src --glob '*.py' --glob '*.ts' --glob '*.tsx'; then
            echo "::error::Stray bare 'main' tokens found in source (likely paste corruption)."
            exit 1
          fi
          echo "Source integrity OK"

  workflow-security:
    name: Workflow security invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: python -m pip install pyyaml

      - name: Run workflow security gate
        # Enforces least-privilege permissions, no dangerous triggers, job
        # timeouts, no secrets: inherit, and persist-credentials: false on
        # every checkout. See scripts/check_workflow_security.py for the
        # full invariant list.
        run: python scripts/check_workflow_security.py

  style:
    name: Style (whitespace / conflict check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Whitespace / conflict check
        # Enforces `git diff --check` on the actual PR/push range so trailing
        # whitespace and whitespace-only conflicts are caught before merge.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          else
            echo "Skipping diff range for ${{ github.event_name }}"
            exit 0
          fi
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "Skipping diff check for the initial commit."
            exit 0
          fi
          git diff --check "$base" "$head"
          echo "Whitespace/conflict check OK"

  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  e2e:
    name: E2E (Playwright smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: web/frontend
    env:
      SECRET_KEY: test-secret-key-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      ANTHROPIC_API_KEY: sk-ant-test-fake-key-for-ci
      OPENAI_API_KEY: sk-test-fake-key-for-ci
      ALLOWED_ORIGINS: http://localhost:5173
      ENVIRONMENT: development
      DATABASE_URL: sqlite:///./arena_ci.db
      # ENCRYPTION_KEY is generated at runtime below to avoid committing
      # a long-lived Fernet key in the workflow file.
      RAZORPAY_API_KEY: rzp_test_dummy
      RAZORPAY_KEY_SECRET: dummy_secret
      RAZORPAY_WEBHOOK_SECRET: dummy_webhook
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install libmagic
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Generate runtime encryption key
        working-directory: backend
        run: |
          KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          echo "ENCRYPTION_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        working-directory: web/frontend
        run: npm ci

      - name: Install Playwright
        run: npm install --no-save @playwright/test && npx playwright install --with-deps chromium

      - name: Start backend
        working-directory: backend
        run: |
          nohup python main.py > /tmp/backend.log 2>&1 &
          # Wait for backend to be ready instead of fixed sleep.
          # /api/health is the public unauthenticated probe (no "ok" string,
          # just a JSON status field) since ci.yml's earlier /api/health split
          # moved uptime/version/etc. behind the authenticated /api/health/detailed.
          for i in {1..30}; do
            if curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:8000/api/health | grep -q '^200$' \
               && grep -q '"status":"healthy"' /tmp/health.json; then
              echo "Backend ready"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start"
          cat /tmp/backend.log
          exit 1

      - name: Run Playwright tests
        # --reporter=line streams concise progress to the GitHub log,
        # --reporter=json writes machine-readable results/playwright-report.json
        # so the failure-upload step has structured data to inspect (and so
        # dependabot/code-review bots can render the failures as a PR comment).
        run: npx playwright test --reporter=line,json

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # Upload BOTH the HTML report (browse in the Actions UI) and the
          # raw JSON results + any failure screenshots/traces the runner
          # captured. Without the JSON, post-mortem on flaky tests requires
          # re-running locally — the JSON is the source of truth.
          name: playwright-report
          path: |
            web/frontend/playwright-report
            web/frontend/test-results
          retention-days: 14
          if-no-files-found: warn

      - name: PR diff size check
        if: github.event_name == 'pull_request'
        run: |
          # Check PR diff size for visibility. Large PRs (>50 changed files)
          # are flagged as warnings to encourage smaller, more reviewable changes.
          # Uses GitHub's compare API to get accurate file count.
          base_sha=${{ github.event.pull_request.base.sha }}
          head_sha=${{ github.event.pull_request.head.sha }}
          file_count=$(curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/compare/${base_sha}...${head_sha}" \
            | jq '.files | length')
          echo "Files changed: $file_count"
          if [ "$file_count" -gt 50 ]; then
            echo "::warning::PR diff is large ($file_count files); consider breaking into smaller changes"
          fi
          # Show detailed diff stats
          git diff --stat "${base_sha}...${head_sha}"

      - name: Summary
        if: always()
        run: |
          echo "## CI Summary"
          echo "- Job: ${{ github.job }}"
          echo "- Status: ${{ job.status }}"
          echo "- Commit: ${{ github.sha }}"
          echo "- Triggered by: ${{ github.actor }}"
