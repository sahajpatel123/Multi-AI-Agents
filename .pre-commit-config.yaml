repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        types: [text]
      - id: end-of-file-fixer
        types: [text]
      # check-yaml / check-json / check-toml keep their upstream default
      # selectors (extension-matched). An earlier revision overrode them
      # with `types: [file]`, which re-tags every file in the repo as a
      # candidate — so the job tried to parse .py/.ts/.tsx sources as
      # YAML/JSON and failed repo-wide on first real execution.
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
        types: [file]

  # Python hooks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # JavaScript/TypeScript hooks.
  # The mirrors-eslint remote hook is unusable here: its v3.0.0 tag predates
  # the repo's own .pre-commit-hooks.yaml (InvalidManifestError on every
  # run), and a nodeenv-installed eslint can't see web/frontend's flat
  # config or plugins. Run the project's OWN eslint instead — same config
  # CI uses, zero duplicate installs.
  - repo: local
    hooks:
      - id: eslint-frontend
        name: eslint (web/frontend)
        # pre-commit passes repo-root-relative paths; strip the
        # web/frontend/ prefix so eslint (run from that directory, where
        # its flat config and node_modules live) sees package-relative ones.
        entry: bash -c 'cd web/frontend && files=(); for f in "$@"; do files+=("${f#web/frontend/}"); done; npx eslint "${files[@]}"' --
        language: system
        files: ^web/frontend/.*\.[jt]sx?$
        pass_filenames: true

  # Gitleaks for secret scanning.
  # Kept current with upstream releases (v8.18.2 was mid-2023 — three years
  # of missed detection rules). Constraint: gitleaks compiles allowlist
  # regexes with Go's native regexp on EVERY v8 build, so anything in
  # .gitleaks.toml using lookahead like `(?!…)` aborts the hook entirely —
  # keep the config lookahead-free (see the sk-ant-test patterns).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ['--config', '.gitleaks.toml']
        pass_filenames: false
        stages: [pre-commit]

  # Secret-key checks. `detect-aws-secret-key` was removed: no version of
  # pre-commit-hooks has ever shipped that hook id, so pre-commit aborted
  # environment validation before running ANY hook in this file. AWS
  # credentials remain covered by gitleaks' default ruleset above.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key

  # Check for TODO/FIXME comments that should be addressed
  - repo: local
    hooks:
      - id: check-debug-statements
        name: check for debug statements
        # rg exits 0 when it FINDS a match and 1 when the scan comes back
        # clean — exactly inverted from what a gate wants. A bare rg entry
        # therefore failed every clean run and would have PASSED on a file
        # full of console.logs. Negate it: clean scan -> success.
        # Glob excludes keep vendored/generated dirs out.
        entry: bash -c '! rg -n "console\.log|pdb\.set_trace|breakpoint\(\)" --glob "*.py" --glob "*.ts" --glob "*.tsx" --glob "!**/.venv*/**" --glob "!**/node_modules/**" --glob "!**/dist/**" --glob "!**/__pycache__/**" .'
        language: system
        always_run: true
        pass_filenames: false
        verbose: true
