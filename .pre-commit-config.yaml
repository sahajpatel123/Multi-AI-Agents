repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        types: [text]
      - id: end-of-file-fixer
        types: [text]
      - id: check-yaml
        types: [file]
      - id: check-json
        types: [file]
      - id: check-toml
        types: [file]
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
        types: [file]

  # Python hooks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # JavaScript/TypeScript hooks.
  # The mirrors-eslint remote hook is unusable here: its v3.0.0 tag predates
  # the repo's own .pre-commit-hooks.yaml (InvalidManifestError on every
  # run), and a nodeenv-installed eslint can't see web/frontend's flat
  # config or plugins. Run the project's OWN eslint instead — same config
  # CI uses, zero duplicate installs.
  - repo: local
    hooks:
      - id: eslint-frontend
        name: eslint (web/frontend)
        # pre-commit passes repo-root-relative paths; strip the
        # web/frontend/ prefix so eslint (run from that directory, where
        # its flat config and node_modules live) sees package-relative ones.
        entry: bash -c 'cd web/frontend && files=(); for f in "$@"; do files+=("${f#web/frontend/}"); done; npx eslint "${files[@]}"' --
        language: system
        files: ^web/frontend/.*\.[jt]sx?$
        pass_filenames: true

  # Gitleaks for secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks
        args: ['--config', '.gitleaks.toml']
        pass_filenames: false
        stages: [pre-commit]

  # Check for debug statements
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: detect-aws-secret-key

  # Check for TODO/FIXME comments that should be addressed
  - repo: local
    hooks:
      - id: check-debug-statements
        name: check for debug statements
        # Use rg with glob excludes so vendored/generated dirs (.venv,
        # node_modules, dist, __pycache__) never trigger false positives.
        entry: rg -n "console\.log|pdb\.set_trace|breakpoint\(\)" --glob '*.py' --glob '*.ts' --glob '*.tsx' --glob '!**/.venv*/**' --glob '!**/node_modules/**' --glob '!**/dist/**' --glob '!**/__pycache__/**' .
        language: system
        always_run: true
        pass_filenames: false
        verbose: true
